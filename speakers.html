<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>講者與主要單位｜構築韌性永續城市研討會</title>
  <meta name="description" content="認識本研討會目前議程所列的講者與主要參與單位.">

  <!-- 外部資源 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* 講者卡片版型：通常不需要修改 */
    .speakers-all-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    .speaker-card-light {
      background: white;
      border: 1px solid var(--fog);
      border-radius: var(--radius-md);
      padding: 32px 24px;
      text-align: center;
    }

    .speaker-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--deep-ocean), var(--tech-green));
      color: white;
    }

    .speaker-card-light h4 {
      color: var(--deep-ocean);
      margin-bottom: 8px;
    }

    .speaker-title {
      color: var(--tech-green);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .speaker-org {
      color: var(--ink-soft);
      font-size: 14px;
    }

    .nav-brand-logo {
      width: 240px;
      height: 104px;
      margin-left: 12px;
      flex: 0 0 240px;
      display: block;
      object-fit: contain;
      border-radius: 10px;
    }

    @media (max-width: 640px) {
      .nav-brand-logo {
        width: 90px;
        height: 42px;
        flex-basis: 90px;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="nav-wrap">
      <a href="index.html" class="nav-brand" aria-label="回到首頁">
        <div class="nav-brand-mark">RS</div>
        <div class="nav-brand-text">
          <div class="ja">韌性永續城市研討會</div>
          <div class="en">AI × Digital Twin × Resilience</div>
        </div>
        <img class="nav-brand-logo" src="images/logo.png" alt="活動 Logo" onerror="this.style.display='none';">
      </a>

      <button class="nav-toggle" aria-label="開啟選單">
        <i class="fa-solid fa-bars"></i>
      </button>

      <div class="nav-links">
        <a href="index.html">首頁</a>
        <a href="agenda.html">議程</a>
        <a href="speakers.html">講者陣容</a>
        <a href="exhibition.html">展示導覽</a>
        <a href="sponsors.html">合作夥伴</a>
        <a href="register.html" class="nav-cta">
          立即報名 <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
    </div>
  </nav>

  <section class="page-banner">
    <div class="breadcrumb">HOME / SPEAKERS &amp; PARTNERS</div>
    <h1>講者與主要單位</h1>
    <p>講者與單位依目前議程表整理，正式職稱與出席名單以核定後公告為準。</p>
  </section>

  <section class="section">
    <div class="container">
      <div class="speakers-all-grid" id="speakersGrid"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 構築韌性永續城市研討會</div>
        <div>活動資訊以正式公告為準</div>
      </div>
    </div>
  </footer>

  <script src="js/common.js"></script>

  <script>
    /* =====================================================
       可編輯區：新增、刪除或修改講者時，只要編輯這份資料。
       avatar = 圓形頭像內顯示的文字
       ===================================================== */
    const speakerData = [
      {
        avatar: '市',
        name: '高雄市府代表',
        title: '開幕及貴賓致詞',
        organization: '高雄市政府代表（邀請／確認中）'
      },
      {
        avatar: '院',
        name: '中華電信學院蘇院長',
        title: '開幕及貴賓致詞',
        organization: '中華電信學院'
      },
      {
        avatar: '工',
        name: '高雄市工務局局長',
        title: '高雄市政府數位孿生永續治理',
        organization: '高雄市工務局 楊欽富 局長'
      },
      {
        avatar: '藏',
        name: '藏識科技、高雄企業',
        title: 'AI 與無人機 ESG 新賽道',
        organization: '產業交流單位 藏識科技 任念志 總經理'
      },
      {
        avatar: '旭',
        name: '旭翔動力科技、台南企業',
        title: 'Sim-to-Real 與無人機 AI 視覺',
        organization: '產業交流單位 旭翔動力科技 楊水利 總經理'
      },
      {
        avatar: '網',
        name: '中華電信網路分公司固網處',
        title: '海地星空之網路韌性佈局與策略',
        organization: '網路韌性專題單位 中華電信網路分公司固網處 洪銘遠 高級工程師'
      },
      {
        avatar: '研',
        name: '中華電信研究院數位創新所',
        title: '超擬真建模技術與應用',
        organization: '研究與技術交流單位 中華電信研究院數位創新所(邀請中)'
      },
      {
        avatar: '行',
        name: '中華電信網路分公司行動南區營運處團隊',
        title: '無人機基地台及衛星通訊車演示',
        organization: '現場展示團隊'
      }
    ];

    /* 版型區：卡片只寫一次，資料會自動產生 */
    const speakersGrid = document.querySelector('#speakersGrid');

    speakersGrid.innerHTML = speakerData.map((speaker) => `
      <article class="speaker-card-light">
        <div class="speaker-avatar">${speaker.avatar}</div>
        <h4>${speaker.name}</h4>
        <div class="speaker-title">${speaker.title}</div>
        <div class="speaker-org">${speaker.organization}</div>
      </article>
    `).join('');
  </script>
</body>

</html>
