<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>活動報名｜構築韌性永續城市研討會</title><meta name="description" content="報名參加 2026 年 10 月 29 日構築韌性永續城市研討會。"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css"><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar"><div class="nav-wrap"><a href="index.html" class="nav-brand" aria-label="回到首頁"><div class="nav-brand-mark">RS</div><div class="nav-brand-text"><div class="ja">韌性永續城市研討會</div><div class="en">AI × Digital Twin × Resilience</div></div></a><button class="nav-toggle" aria-label="開啟選單"><i class="fa-solid fa-bars"></i></button><div class="nav-links"><a href="index.html">首頁</a><a href="agenda.html">議程</a><a href="speakers.html">講者陣容</a><a href="exhibition.html">展示導覽</a><a href="sponsors.html">合作夥伴</a><a href="register.html" class="nav-cta">立即報名 <i class="fa-solid fa-arrow-right"></i></a></div></div></nav><section class="page-banner"><div class="breadcrumb">HOME / REGISTRATION</div><h1>報名參與研討會</h1><p>活動日期為 2026 年 10 月 29 日（四）09:30–17:00，歡迎同仁、企業、研究與技術夥伴參與。</p></section><section class="section register-section"><div class="container"><div class="register-wrap"><aside class="ticket-panel"><h3 style="margin-bottom:16px;color:var(--deep-ocean);font-size:20px;"><i class="fa-solid fa-ticket" style="color:var(--tech-green);"></i> 參與身分選擇</h3><label class="ticket-card selected" data-ticket="內部同仁票"><input type="radio" name="ticket" value="內部同仁票" checked hidden><div class="ticket-head"><h4>🏢 南部同仁報名</h4><div class="ticket-price">內部交流 <small>／免費</small></div></div><p class="ticket-desc">供內部同仁及協辦工作人員報名參與。</p><ul><li>全日議程入場</li><li>午餐及現場參訪</li><li>9 項展示體驗</li></ul></label><label class="ticket-card" data-ticket="企業／研究夥伴"><input type="radio" name="ticket" value="企業／研究夥伴" hidden><div class="ticket-head"><h4>💼 企業／研究夥伴</h4><div class="ticket-price">交流報名 <small>／審核制</small></div></div><p class="ticket-desc">歡迎企業、研究單位與技術夥伴報名交流。</p><ul><li>產官學研交流</li><li>全日議程與展示導覽</li><li>後續合作媒合</li></ul></label><p style="font-size:13px;color:var(--ink-soft);margin-top:16px;">正式報名資格、名額、場地與行前通知，以主辦單位後續公告為準。</p></aside><div class="form-card"><h2>報名資料填寫</h2><p>請填寫以下資訊，方便安排報到、餐點與活動通知。</p><form id="register-form" novalidate><div class="form-row"><div class="form-group"><label class="form-label">姓名<span class="req">*</span></label><input type="text" class="form-input" name="name" required placeholder="請填寫姓名"></div><div class="form-group"><label class="form-label">職稱<span class="req">*</span></label><input type="text" class="form-input" name="title" required placeholder="您的職稱"></div></div><div class="form-group"><label class="form-label">所屬單位／企業名稱<span class="req">*</span></label><input type="text" class="form-input" name="organization" required placeholder="請填寫單位名稱"></div><div class="form-row"><div class="form-group"><label class="form-label">Email<span class="req">*</span></label><input type="email" class="form-input" name="email" required placeholder="報名通知信箱"></div><div class="form-group"><label class="form-label">聯絡電話<span class="req">*</span></label><input type="tel" class="form-input" name="phone" required placeholder="手機或市話"></div></div><div class="form-group"><label class="form-label">感興趣的展示或議題（可複選）</label><div class="chip-group" id="interest-chips"><label class="chip"><input type="checkbox" name="interests" value="數位孿生治理"> 數位孿生治理</label><label class="chip"><input type="checkbox" name="interests" value="AI 與 ESG"> AI 與 ESG</label><label class="chip"><input type="checkbox" name="interests" value="無人機 AI 視覺"> 無人機 AI 視覺</label><label class="chip"><input type="checkbox" name="interests" value="網路韌性"> 網路韌性</label><label class="chip"><input type="checkbox" name="interests" value="衛星通訊"> 衛星通訊</label><label class="chip"><input type="checkbox" name="interests" value="VR 模擬"> VR 模擬</label><label class="chip"><input type="checkbox" name="interests" value="智慧巡檢"> 智慧巡檢</label><label class="chip"><input type="checkbox" name="interests" value="超擬真建模"> 超擬真建模</label><label class="chip"><input type="checkbox" name="interests" value="ESG 與淨零"> ESG 與淨零</label></div></div><div class="form-group"><label class="form-label">午餐需求</label><select class="form-select" name="dietary"><option value="葷食">葷餐盒（無特殊需求）</option><option value="素食">素食餐盒</option></select></div><div class="form-group"><label class="check-row" style="background:rgba(0,229,160,0.06);"><input type="checkbox" id="agree" required><div><strong>我已確認並同意提供報名資訊</strong><span>資料僅供活動報名、身分識別、餐點與行前通知使用。</span></div></label></div><button type="submit" class="btn btn-primary btn-block" style="padding:18px 28px;font-size:16px;"><i class="fa-solid fa-paper-plane"></i> 送出報名</button></form><p style="margin-top:16px;font-size:13px;color:var(--ink-soft);">目前為網站展示版表單；正式資料串接與報名結果通知，請依主辦單位公告辦理。</p></div></div></div></section><script>let currentTicket='內部同仁票';document.querySelectorAll('.ticket-card').forEach(card=>card.addEventListener('click',()=>{document.querySelectorAll('.ticket-card').forEach(c=>c.classList.remove('selected'));card.classList.add('selected');card.querySelector('input[type=radio]').checked=true;currentTicket=card.dataset.ticket;}));document.querySelectorAll('#interest-chips .chip input').forEach(input=>input.addEventListener('change',()=>input.closest('.chip').classList.toggle('active',input.checked)));document.getElementById('register-form').addEventListener('submit',e=>{e.preventDefault();alert('報名表單已送出。正式報名結果與通知請依主辦單位公告辦理。');});</script><footer class="footer"><div class="container"><div class="footer-bottom"><div>© 2026 構築韌性永續城市研討會</div><div>活動資訊以正式公告為準</div></div></div></footer><script src="js/common.js"></script></body></html>
